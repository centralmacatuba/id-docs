version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    assignees:
      - centralmacatuba
      - desenvolvedor-ee
      - desenvolvedoree-bot
    groups:
      vitepress:
        patterns:
          - vitepress

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees:
      - centralmacatuba
      - desenvolvedor-ee
      - desenvolvedoree-bot
    commit-message:
      prefix: ci
      include: scope
