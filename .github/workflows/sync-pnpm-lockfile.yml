name: Sync pnpm lockfile

on:
  push:
    branches:
      - "feat/**"
    paths:
      - package.json
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.ref != 'refs/heads/principal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.12.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Validate frozen lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Commit and push lockfile when changed
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            echo "Lockfile is already synchronized and passes frozen validation."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git commit -m "chore: sync pnpm lockfile"
          gh auth setup-git
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not start follow-up push or pull_request workflows.
      # Dispatch the branch validation explicitly after the lockfile commit.
      - name: Dispatch validation for the synchronized lockfile
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --ref "$GITHUB_REF_NAME"
          gh workflow run check-links.yml --ref "$GITHUB_REF_NAME"
          gh workflow run zizmor.yml --ref "$GITHUB_REF_NAME"
