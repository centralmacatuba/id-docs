name: Review Portuguese documentation

on:
  pull_request:
    branches:
      - principal

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: languagetool-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  languagetool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Portuguese text
        uses: reviewdog/action-languagetool@afd06e9b0f782c9562c92efffb66a49c09b2b4f4 # v1.23.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          language: pt-BR
          reporter: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'github-pr-review' || 'local' }}
          level: info
          patterns: "README.md CONTRIBUTING.md SECURITY.md docs/**/*.md"
          disabled_rules: "DOUBLE_PUNCTUATION,DOUBLE_PUNCTUATION_XML,PORTUGUESE_WORD_REPEAT_BEGINNING_RULE,FRAGMENT_TWO_PREPOSITIONS,PT_BARBARISMS_REPLACE_MANAGER,PT_BARBARISMS_REPLACE_SERVER,PT_BARBARISMS_REPLACE_STATUS,PT_BARBARISMS_REPLACE_SCRIPTS,PT_BARBARISMS_REPLACE_APP,UNLIKELY_OPENING_PUNCTUATION,ABREVIATIONS_PUNCTUATION,UPPERCASE_SENTENCE_START,UPPERCASE_AFTER_COMMA,URL_VALIDATION,PT_COMPOUNDS_PRE_REFORM_NÃO_AUTORIZADO"
