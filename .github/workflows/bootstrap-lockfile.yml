name: Bootstrap VitePress lockfile and validate build

on:
  push:
    branches:
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Build VitePress
        run: pnpm build

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: initial-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
